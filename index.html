<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="A team messaging workspace for product updates, store operations, and customer support.">
<meta name="keywords" content="chat application, messaging, real-time chat, web app">
<meta name="author" content="Omkar R. Ghare">
<title>ChatApp Pro | Premium Messaging Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Preloader -->
<div id="preloader">
<div class="preloader-logo">
<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.74.5 3.37 1.35 4.75L2 22l5.25-1.35C8.63 21.5 10.26 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm5.46 14.12c-.22.63-1.32 1.2-1.82 1.28-.49.08-1.1.11-1.77-.11-.41-.14-.93-.33-1.6-.64-2.82-1.32-4.66-4.16-4.8-4.36-.14-.19-1.13-1.5-1.13-2.87 0-1.36.71-2.04.97-2.32.26-.28.57-.35.76-.35h.55c.18 0 .42-.07.65.5.24.57.8 1.97.87 2.11.07.14.12.31.02.5-.09.19-.14.31-.28.47-.14.17-.29.38-.42.51-.14.14-.28.29-.12.57.17.28.74 1.22 1.58 1.97 1.09.97 2 1.27 2.29 1.41.28.14.45.12.61-.07.17-.19.71-.83.9-1.11.19-.28.38-.24.63-.14.26.09 1.63.77 1.91.91.28.14.47.21.54.33.07.12.07.69-.15 1.32z"/></svg>
</div>
<div class="preloader-text">ChatApp Pro</div>
<div class="preloader-bar"></div>
</div>

<!-- Main App -->
<div class="app-container" id="app">

<!-- Mobile Overlay -->
<div class="mobile-overlay" id="mobileOverlay"></div>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
<!-- Profile Panel -->
<div class="profile-panel" id="profilePanel">
<div class="profile-panel-header">
<button onclick="closeProfile()"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
<h3>Profile</h3>
</div>
<div class="profile-content">
<div class="profile-big-avatar"><img src="images/Omkar.jpeg" alt="Omkar Ghare" loading="lazy"></div>
<div class="profile-name">Omkar R. Ghare</div>
<div class="profile-about">Building web projects and sharing ideas.</div>
</div>
</div>

<div class="sidebar-header">
<div class="user-avatar" onclick="openProfile()">
<img src="images/Omkar.jpeg" alt="Omkar R. Ghare" loading="lazy">
</div>
<div class="header-actions">
<button class="header-btn" title="Status" aria-label="Status">
<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3"/></svg>
</button>
<button class="header-btn" title="New Chat" aria-label="New Chat">
<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12zM11 5h2v4h4v2h-4v4h-2v-4H7V9h4z"/></svg>
</button>
<button class="header-btn" id="menuBtn" title="Menu" aria-label="Menu">
<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-２-.9-２-２-２z "/></svg>
</button>
</div>
</div>

<div class="search-container">
<div class="search-box">
<svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
<input type="text" id="searchInput" placeholder="Search or start new chat" aria-label="Search contacts">
</div>
</div>

<div class="contact-list" id="contactList"></div>
</div>

<!-- Chat Area -->
<div class="chat-area" id="chatArea">
<div class="welcome-screen" id="welcomeScreen">
<svg class="welcome-icon" viewBox="0 0 303 172" fill="none">
<rect x="30" y="10" width="243" height="140" rx="16" fill="var(--border-color)" opacity="0.5"/>
<rect x="45" y="30" width="100" height="12" rx="6" fill="var(--accent)" opacity="0.3"/>
<rect x="45" y="50" width="180" height="8" rx="4" fill="var(--text-secondary)" opacity="0.2"/>
<rect x="45" y="66" width="140" height="8" rx="4" fill="var(--text-secondary)" opacity="0.2"/>
<rect x="45" y="82" width="160" height="8" rx="4" fill="var(--text-secondary)" opacity="0.2"/>
<rect x="45" y="110" width="200" height="20" rx="10" fill="var(--accent)" opacity="0.2"/>
<circle cx="252" cy="42" r="20" fill="var(--accent)" opacity="0.15"/>
<path d="M248 42l4 4 8-8" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
</svg>
<h2>Your team, in the loop</h2>
<p>Quick updates from the people building, shipping, and supporting NexaShop.</p>
</div>

<!-- Active Chat (hidden by default) -->
<div id="activeChat" style="display:none;flex-direction:column;height:100%">
<div class="chat-header">
<button class="back-btn" id="backBtn" aria-label="Back">
<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
</button>
<div class="chat-header-avatar" id="chatAvatar">
<img src="" alt="Contact" id="chatAvatarImg" loading="lazy">
</div>
<div class="chat-header-info">
<div class="chat-header-name" id="chatName"></div>
<div class="chat-header-status" id="chatStatus"></div>
</div>
<div class="chat-header-actions">
<button class="header-btn" title="Video Call" aria-label="Video Call">
<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
</button>
<button class="header-btn" title="Voice Call" aria-label="Voice Call">
<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/></svg>
</button>
<button class="header-btn" title="Search" aria-label="Search Messages">
<svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
</button>
</div>
</div>

<div class="messages-container" id="messagesContainer"></div>

<!-- Typing Indicator -->
<div class="typing-indicator" id="typingIndicator" style="display:none">
<div class="message-bubble" style="background:var(--typing-bg);border-radius:8px;border-top-left-radius:0">
<div class="typing-dot"></div>
<div class="typing-dot"></div>
<div class="typing-dot"></div>
</div>
</div>

<!-- Emoji Picker -->
<div class="emoji-picker" id="emojiPicker">
<div class="emoji-header">
<input type="text" class="emoji-search" placeholder="Search emoji..." id="emojiSearch" aria-label="Search emoji">
</div>
<div class="emoji-categories">
<button class="emoji-cat-btn active" data-cat="smileys">😀</button>
<button class="emoji-cat-btn" data-cat="people">👋</button>
<button class="emoji-cat-btn" data-cat="animals">🐱</button>
<button class="emoji-cat-btn" data-cat="food">🍕</button>
<button class="emoji-cat-btn" data-cat="travel">✈️</button>
<button class="emoji-cat-btn" data-cat="objects">💡</button>
<button class="emoji-cat-btn" data-cat="symbols">❤️</button>
</div>
<div class="emoji-grid" id="emojiGrid"></div>
</div>

<!-- File Preview -->
<div class="file-preview" id="filePreview">
<button class="file-preview-close" onclick="closeFilePreview()">✕</button>
<div class="file-preview-content">
<div class="file-preview-icon">
<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11z"/></svg>
</div>
<div class="file-preview-info">
<h4 id="fileName">document.pdf</h4>
<p id="fileSize">2.4 MB</p>
</div>
</div>
</div>

<!-- Input Area -->
<div class="input-area">
<button class="input-btn" id="emojiBtn" title="Emoji" aria-label="Emoji">
<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-5-6c.78 2.34 2.72 4 5 4s4.22-1.66 5-4H7zm1-2c.55 0 1-.45 1-1s-.45-1-1-1-1 .45-1 1 .45 1 1 1zm8 0c.55 0 1-.45 1-1s-.45-1-1-1-1 .45-1 1 .45 1 1 1z"/></svg>
</button>
<button class="input-btn" id="attachBtn" title="Attach" aria-label="Attach file">
<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
</button>
<div class="input-wrapper">
<textarea id="messageInput" placeholder="Type a message" rows="1" aria-label="Type a message"></textarea>
</div>
<button class="send-btn" id="sendBtn" title="Send" aria-label="Send message">
<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
</button>
</div>
</div>
</div>
</div>

<!-- Theme Toggle -->
<button class="theme-toggle" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
<svg id="themeIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
</button>

<!-- Context Menu -->
<div class="context-menu" id="contextMenu">
<div class="context-item" data-action="reply"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z"/></svg>Reply</div>
<div class="context-item" data-action="copy"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>Copy</div>
<div class="context-item" data-action="forward"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 15V9l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11z" transform="scale(-1,1) translate(-24,0)"/></svg>Forward</div>
<div class="context-item" data-action="star"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>Star</div>
<div class="context-item danger" data-action="delete"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>Delete</div>
</div>

<!-- Image Viewer -->
<div class="image-viewer" id="imageViewer">
<button class="image-viewer-close" onclick="closeImageViewer()">✕</button>
<img src="" alt="Full size" id="viewerImage">
</div>

<!-- Toast -->
<div class="toast" id="toast">
<div class="toast-icon success"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
<div class="toast-content">
<h4 id="toastTitle">Success</h4>
<p id="toastText">Message sent successfully</p>
</div>
</div>

<input type="file" id="fileInput" style="display:none" accept="image/*,.pdf,.doc,.docx,.txt">

<script src="js/script.js"></script>
</body>
</html>
